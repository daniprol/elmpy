# Git hooks, run by prek (https://prek.j178.dev), a fast drop-in for pre-commit.
# Install them once with `uv run prek install`. CI runs the same hooks.
#:schema https://www.schemastore.org/prek.json

# Fast checks built into prek itself.
[[repos]]
repo = "builtin"
hooks = [
    { id = "trailing-whitespace" },
    { id = "end-of-file-fixer" },
    { id = "mixed-line-ending" },
    { id = "check-yaml" },
    { id = "check-toml" },
    { id = "check-merge-conflict" },
    { id = "check-added-large-files" },
    { id = "detect-private-key" },
]

# The project's own tools. They run through `uv run`, so their versions come
# from uv.lock and match what you get in your editor and in CI.
[[repos]]
repo = "local"
hooks = [
    { id = "uv-lock", name = "uv.lock is up to date", entry = "uv lock --check", language = "system", files = "^(pyproject\\.toml|uv\\.lock)$", pass_filenames = false },
    { id = "ruff-check", name = "ruff check", entry = "uv run ruff check --fix", language = "system", types = ["python"] },
    { id = "ruff-format", name = "ruff format", entry = "uv run ruff format", language = "system", types = ["python"] },
    { id = "pyright", name = "pyright", entry = "uv run pyright", language = "system", types = ["python"], pass_filenames = false },
    { id = "pytest", name = "pytest", entry = "uv run pytest -q", language = "system", types = ["python"], pass_filenames = false },
]
