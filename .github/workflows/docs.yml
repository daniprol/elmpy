name: Docs

on:
  push:
    branches: [main]
  pull_request: # build only, to catch broken docs before merging

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
      - name: Install Python and dependencies
        run: uv sync --locked --group docs
      - name: Build the site
        run: uv run zensical build --strict
      - name: Add the live examples
        # The Examples page embeds the real apps. boot.js loads elmpy from ../src/elmpy/.
        run: mkdir -p site/live && cp -r examples src site/live/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
