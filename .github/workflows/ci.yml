name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
      - name: Install Python and dependencies
        run: uv sync --locked
      - name: Run all checks (the same hooks as `git commit`)
        run: uv run prek run --all-files --show-diff-on-failure
